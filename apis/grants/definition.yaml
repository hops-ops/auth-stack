apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: grants.auth.hops.ops.com.ai
spec:
  group: auth.hops.ops.com.ai
  names:
    kind: Grant
    plural: grants
  scope: Namespaced
  versions:
  - name: v1alpha1
    referenceable: true
    served: true
    schema:
      openAPIV3Schema:
        description: |
          Grant is the first-class membership relationship that ties a
          Zitadel User to a Project + Roles. Polymorphic over same-Org
          and cross-Org grants:

          - same-Org (`spec.userOrgId == spec.projectOrgId`): composes
            ONE `user.zitadel.m.crossplane.io/Grant` MR (the user's role
            assignment within the project).

          - cross-Org (`spec.userOrgId != spec.projectOrgId`): composes
            TWO MRs — a `project.zitadel.m.crossplane.io/Grant` (the
            cross-Org Project Grant authorizing roles for the user's
            home Org) plus a `user.zitadel.m.crossplane.io/Grant` (the
            user's role assignment, with `projectGrantId` pointing at
            the Project Grant). Multi-iter: user/Grant emits once
            project/Grant is observed.

          Caller identifies the user and project either by local managed
          resource references (`userIdRef` + `projectIdRef`) or by explicit
          Zitadel IDs (`userId + userOrgId + projectId + projectOrgId`). The
          composition resolves references from status.atProvider and picks the
          right Zitadel mechanism. See [[specs/grant-xrd]] for the design.
        type: object
        properties:
          spec:
            description: GrantSpec defines the desired state.
            type: object
            properties:
              userId:
                description: |
                  Zitadel user UUID. Operator copies from the upstream
                  MachineUser / HumanUser MR's status.atProvider.id (or
                  Zitadel UI). Mutually exclusive with userIdRef.
                type: string
              userIdRef:
                description: |
                  Reference to a HumanUser or MachineUser managed resource in
                  the Grant namespace. The composition resolves userId and
                  userOrgId from status.atProvider.
                  Mutually exclusive with userId + userOrgId.
                type: object
                properties:
                  name:
                    type: string
                    minLength: 1
                  apiVersion:
                    type: string
                    default: user.zitadel.m.crossplane.io/v1alpha1
                  kind:
                    type: string
                    default: HumanUser
                    enum:
                    - HumanUser
                    - MachineUser
                required:
                - name
              userOrgId:
                description: |
                  The user's home Org UUID. For same-Org grants, equal
                  to projectOrgId. Mutually exclusive with userIdRef.
                type: string
              projectId:
                description: |
                  Target Zitadel Project UUID. Mutually exclusive with
                  projectIdRef.
                type: string
              projectIdRef:
                description: |
                  Reference to a Project managed resource in the Grant
                  namespace. The composition resolves projectId and
                  projectOrgId from status.atProvider.
                  Mutually exclusive with projectId + projectOrgId.
                type: object
                properties:
                  name:
                    type: string
                    minLength: 1
                  apiVersion:
                    type: string
                    default: project.zitadel.m.crossplane.io/v1alpha1
                  kind:
                    type: string
                    default: Project
                    enum:
                    - Project
                required:
                - name
              projectOrgId:
                description: |
                  The Org UUID where the target Project lives. Mutually
                  exclusive with projectIdRef.
                type: string
              roles:
                description: |
                  Role keys assigned to the user within the Project.
                  Each must match a Role defined on the target Project.
                type: array
                items:
                  type: string
                minItems: 1
              providerConfigRef:
                description: ProviderConfig for provider-upjet-zitadel.
                type: object
                properties:
                  name:
                    type: string
                  kind:
                    type: string
                    default: "ProviderConfig"
              managementPolicies:
                description: |
                  Crossplane managementPolicies for all composed resources.
                  Defaults to ["*"].
                type: array
                items:
                  type: string
                default: ["*"]
              labels:
                description: |
                  Custom labels merged with stack defaults; applied to
                  every composed resource.
                type: object
                additionalProperties:
                  type: string
                x-kubernetes-preserve-unknown-fields: true
            x-kubernetes-validations:
            - rule: '(has(self.userIdRef) && !has(self.userId) && !has(self.userOrgId)) || (!has(self.userIdRef) && has(self.userId) && has(self.userOrgId))'
              message: "provide exactly one user source: userIdRef, or userId + userOrgId"
            - rule: '(has(self.projectIdRef) && !has(self.projectId) && !has(self.projectOrgId)) || (!has(self.projectIdRef) && has(self.projectId) && has(self.projectOrgId))'
              message: "provide exactly one project source: projectIdRef, or projectId + projectOrgId"
            required:
            - roles
            - providerConfigRef

          status:
            type: object
            properties:
              mode:
                description: |
                  Composition mode discriminator — "same-org" or
                  "cross-org", computed from userOrgId vs projectOrgId.
                type: string
              userGrantId:
                description: Underlying user/Grant MR's Zitadel UUID.
                type: string
              projectGrantId:
                description: |
                  Underlying project/Grant MR's Zitadel UUID. Only set
                  for cross-org mode.
                type: string
              ready:
                type: boolean
              referencesResolved:
                description: Whether all requested user and project references have IDs.
                type: boolean
        required:
        - spec
