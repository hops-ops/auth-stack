apiVersion: hops.ops.com.ai/v1alpha1
kind: AuthStack
metadata:
  name: identity
  namespace: platform
spec:
  clusterName: platform
  domain: auth.example.com
  firstInstance:
    masterkey:
      secretRef: {name: zitadel-masterkey}
  database:
    external:
      dsnSecretRef: {name: zitadel-db, key: dsn}
  instanceDiscovery:
    enabled: true
    providerConfigRef: {name: zitadel-admin, kind: ClusterProviderConfig}
