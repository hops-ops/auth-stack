name: on-push-main

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/on-push-main.yaml"
      - ".github/workflows/on-version-tagged.yaml"
      - ".gitops/**"
      - "apis/**"
      - "examples/**"
      - "functions/**"
      - "tests/**"
      - "upbound.yaml"

permissions:
  packages: write
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  validate:
    uses: hops-ops/workflows-crossplane/.github/workflows/validate.yaml@v3.0.0
    with:
      examples: |
        [
          { "example": "examples/authstacks/minimal.yaml",      "api_path": "apis/authstacks" },
          { "example": "examples/authstacks/standard.yaml",     "api_path": "apis/authstacks" },
          { "example": "examples/authstacks/local-colima.yaml", "api_path": "apis/authstacks" },
          { "example": "examples/machineusers/minimal.yaml",      "api_path": "apis/machineusers" },
          { "example": "examples/machineusers/with-pat.yaml",     "api_path": "apis/machineusers" },
          { "example": "examples/machineusers/with-pat-push.yaml","api_path": "apis/machineusers" },
          { "example": "examples/grants/same-org.yaml",            "api_path": "apis/grants" },
          { "example": "examples/grants/cross-org.yaml",           "api_path": "apis/grants" }
        ]
      error_on_missing_schemas: true

  test:
    uses: hops-ops/workflows-crossplane/.github/workflows/test.yaml@v3.0.0

  e2e:
    uses: hops-ops/workflows-crossplane/.github/workflows/e2e.yaml@v3.0.0

  version-and-tag:
    name: Version and Tag
    needs:
      - validate
      - test
      - e2e
    uses: unbounded-tech/workflow-vnext-tag/.github/workflows/workflow.yaml@v1.21.3
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    with:
      useDeployKey: true
